  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">

<body>
  <section class="robot-hero" aria-label="智元机器人首页">
    <div class="space-scene" aria-hidden="true">
      <span class="orbit orbit-one"></span>
      <span class="orbit orbit-two"></span>
      <span class="orbit orbit-three"></span>
      <span class="star star-one"></span>
      <span class="star star-two"></span>
      <span class="star star-three"></span>

    <div class="hero-overlay" aria-hidden="true"></div>

    <nav class="hero-nav" aria-label="主导航">
      <div class="nav-left">
        <a class="active" href="index.html">首页</a>
        <a href="interaction.html">交互</a>
        <a href="support.html">支持</a>
      </div>
      <a class="text-logo" href="index.html" aria-label="智元机器人首页">智元机器人</a>

        浏览模型 <span>→</span>
      </a>
